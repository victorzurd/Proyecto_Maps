name: Android CI (Wise Maps)

on:
  push:
    branches: [ "main", "it-*", "h-*" ]
  pull_request:
    branches: [ "main", "it-*" ]

jobs:
  build-and-test:
    name: Build & Run Acceptance Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile App and Acceptance Tests (Must Pass)
        run: ./gradlew assembleDebug compileDebugUnitTestKotlin

      - name: Run Unit & Acceptance Tests (ATDD Report)
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --continue

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-test-report
          path: app/build/reports/tests/testDebugUnitTest/
